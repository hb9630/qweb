[package]
name = "qweb-server"
version = "0.1.0"
edition = "2021"
description = "qweb 服务进程：bind/信号/启动日志（业务在 qweb-core）；desktop feature = Windows Tauri 壳"
license = "Apache-2.0"

# 产物名对齐部署名：target/release/qweb → /usr/local/qweb（make/make install 同款语义）
[[bin]]
name = "qweb"
path = "src/main.rs"

# Windows 桌面壳（Tauri + WebView2，窗口导航进程内 axum）：需 --features desktop，
# 仅 Windows 编译（其他平台用 qweb 浏览器版）
[[bin]]
name = "qweb-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[features]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
qweb-core = { path = "../qweb-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }
