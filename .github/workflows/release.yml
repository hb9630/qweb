# 发版流水线：推 v* tag → 云端构建多平台产物并挂 GitHub Release
#   git tag v0.1.0 && git push origin v0.1.0
# 产物：ccweb-desktop-<tag>.exe（Windows Tauri 桌面版）/ ccweb-<tag>.exe（浏览器版）/ ccweb-linux-<tag>（服务器单文件）
# runner 自带 MSVC 2022 + Node（本机的 GNU link 冒充 / SDK 检测坑在云端不存在）
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - name: 前端构建（dist 嵌入 Rust 二进制）
        run: npm ci && npm run build
        working-directory: frontend
      - name: Rust 构建（desktop feature：桌面版 + 浏览器版一次出）
        run: cargo build --release -p ccweb-server --features desktop
        working-directory: backend
      - name: 收集产物
        shell: bash
        run: |
          cp backend/target/release/ccweb-desktop.exe "ccweb-desktop-${{ github.ref_name }}.exe"
          cp backend/target/release/ccweb.exe "ccweb-${{ github.ref_name }}.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "ccweb-*.exe" }
      - name: 挂 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "ccweb-*.exe"
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - name: 前端构建（dist 嵌入 Rust 二进制）
        run: npm ci && npm run build
        working-directory: frontend
      - name: Rust 构建（浏览器版单文件）
        run: cargo build --release -p ccweb-server
        working-directory: backend
      - name: 收集产物
        run: cp backend/target/release/ccweb "ccweb-linux-${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "ccweb-linux-*" }
      - name: 挂 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "ccweb-linux-*"
          generate_release_notes: true
